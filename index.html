<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
<a-scene>

      <!-- ============ ESTACIÓN 1 (Parte A) — al frente, 0° ============ -->
      <a-entity position="0 0 -8">
        <a-box position="0 1 0" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="2 1 -1" radius="1" color="#EF2D5E"></a-sphere>
        <a-cylinder position="-2 1 -1" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
        <a-plane rotation="-90 0 0" width="10" height="10" position="0 0 -1" color="#7BC8A4"></a-plane>
        <a-text value="Parte A" position="0 3 0" align="center" color="#333" width="6"></a-text>
      </a-entity>

      <!-- ============ ESTACIÓN 2 (Parte C, brazo) — girada 120° ============ -->
      <a-entity position="6.93 0 4" rotation="0 -120 0">
        <a-cylinder position="0 0.15 0" radius="0.5" height="0.3" color="#37474F"></a-cylinder>
        <a-entity id="hombro" position="0 0.3 0" rotation="0 20 0">
          <a-box position="0 0.5 0" width="0.3" height="1" depth="0.3" color="#4CC3D9"></a-box>
          <a-entity id="codo" position="0 1 0" rotation="0 0 -30">
            <a-box position="0 0.4 0" width="0.25" height="0.8" depth="0.25" color="#FFC65D"></a-box>
            <a-entity id="muneca" position="0 0.8 0" rotation="0 0 20">
              <a-cylinder position="0 0.15 0" radius="0.12" height="0.3" color="#8D6E63"></a-cylinder>
              <a-entity position="0 0.3 0">
                <a-box position="-0.1 0.1 0" width="0.08" height="0.2" depth="0.08" color="#EF2D5E"></a-box>
                <a-box position="0.1 0.1 0" width="0.08" height="0.2" depth="0.08" color="#EF2D5E"></a-box>
                <a-sphere position="0 0.35 0" radius="0.07" color="#EF2D5E"></a-sphere>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
        <a-plane rotation="-90 0 0" width="6" height="6" color="#B0B0B0"></a-plane>
        <a-text value="Parte C" position="0 3 0" align="center" color="#333" width="6"></a-text>
      </a-entity>

      <!-- ============ ESTACIÓN 3 (Parte D, modelo CAD) — girada 240° ============ -->
      <a-assets>
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
      </a-assets>

      <a-entity position="-6.93 0 4" rotation="0 120 0">
        <a-entity gltf-model="#modeloIndustrial" position="0 0 0" scale="0.01 0.01 0.01"></a-entity>
        <a-plane rotation="-90 0 0" width="8" height="8" color="#B0B0B0"></a-plane>
        <a-text value="Parte D" position="0 3 0" align="center" color="#333" width="6"></a-text>
      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
