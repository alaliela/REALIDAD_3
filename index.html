<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene>
  <a-entity position="0 0 -5">
    <!-- Base de la celda de manufactura -->
    <a-plane rotation="-90 0 0" width="6" height="4" color="#B0B0B0"></a-plane>

    <!-- Tanque de almacenamiento -->
    <a-cylinder position="-2 1 0" radius="0.6" height="2" color="#3A86FF"></a-cylinder>

    <!-- Banda transportadora -->
    <a-box position="0.5 0.3 0" width="3" height="0.2" depth="0.8" color="#8D6E63"></a-box>

    <!-- Estructura de soporte -->
    <a-box position="-1.2 0.5 0" width="0.2" height="1" depth="0.2" color="#4CC3D9"></a-box>
    <a-box position="2 0.5 0" width="0.2" height="1" depth="0.2" color="#4CC3D9"></a-box>

    <!-- Sensor indicador -->
    <a-sphere position="0.5 0.6 0" radius="0.15" color="#EF2D5E"></a-sphere>
  </a-entity>
  <a-sky color="#ECECEC"></a-sky>
</a-scene>
  </body>
</html>
